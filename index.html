<!-- Splash / Loader (drop-in) -->
<div id="splash" aria-live="polite">
  <div class="splash-card">
    <div class="logos">
      <img class="logo" src="./assets/logo/cdcl.png" alt="CDCL">
      <img class="logo logo--right" src="./assets/logo/umd_big.png" alt="UMD">
    </div>
    <h1 class="title">🔥 Wildfire Forecasting</h1>
    <p id="splash-msg" class="msg">Loading data...</p>
    <div class="bar" id="splash-progress"></div>
  </div>
</div>


<script>
  window.Splash = (() => {
    const el   = document.getElementById('splash');
    const msg  = document.getElementById('splash-msg');
    const bar  = document.getElementById('splash-progress');

    return {
      show(text){
        if (text) msg.textContent = text;
        el.hidden = false;
        el.style.opacity = '1';
        bar?.style.setProperty('--w', '0%');
      },
      setMessage(text){ if (text) msg.textContent = text; },
      setProgress(pct){
        const v = Math.max(0, Math.min(100, Number(pct)||0));
        bar?.style.setProperty('--w', v + '%');
      },
      hide(){
        el.style.opacity = '0';
        el.style.visibility = 'hidden';
        setTimeout(() => el.remove(), 300);
      }
    };
  })();

  // Auto-show on load
  document.addEventListener('DOMContentLoaded', () => {
    Splash.show('Loading data…');
  });
</script>

  <script type="module">
    // Wire Rank/YoY buttons after app.js is ready
    const ready = () => {
      if (typeof window.setColorMode === 'function') {
        document.getElementById('colorRank')?.addEventListener('click', ()=>window.setColorMode('rank'));
        document.getElementById('colorYoY') ?.addEventListener('click', ()=>window.setColorMode('yoy'));
      }
    };
    let tries=0; const id=setInterval(()=>{tries++; if (window.setColorMode||tries>30){clearInterval(id); ready();}},150);
